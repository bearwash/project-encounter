[package]
name = "project_encounter"
version = "0.1.0"
description = "BLE すれ違いアバターアプリ"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "project_encounter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
rand = "0.8"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"

# 実 BLE (macOS / Linux / Windows) — iOS/Android は別途プラグイン要 (Phase 2)
# spec: docs/specs/ble-handshake.md
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
btleplug = "0.11"
