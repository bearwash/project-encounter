[package]
name = "tauri-plugin-encounter-ble"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-encounter-ble"
build = "build.rs"

[lib]
name = "tauri_plugin_encounter_ble"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.11.1", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2.6.1", features = ["build"] }
